<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apprendre le Coran - LE VERIDIQUE A-Z</title>
    
    <style>
        :root {
            --primary-dark: #064e3b;
            --primary-accent: #059669;
            --gold-accent: #d97706;
            --gold-light: #fef3c7;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --card-inner-bg: #edf2f7;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --primary-dark: #10b981;
            --primary-accent: #34d399;
            --gold-accent: #fbbf24;
            --gold-light: rgba(251, 191, 36, 0.15);
            --bg-main: #060911;
            --card-bg: #0f172a;
            --card-inner-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .onboarding-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 78, 59, 0.95);
            backdrop-filter: blur(12px);
            z-index: 10000;
            display: flex; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box;
        }

        .onboarding-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px 25px;
            width: 100%; max-width: 380px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(217, 119, 6, 0.3);
        }

        .bismillah-header { font-size: 1.5rem; color: var(--primary-dark); margin-bottom: 10px; font-weight: 700; }
        .onboarding-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
        .onboarding-subtitle { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }

        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px; border-radius: 12px;
            border: 1px solid var(--border-color); background: var(--bg-main);
            color: var(--text-main); font-size: 0.95rem; box-sizing: border-box; outline: none;
        }

        .btn-continue {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #064e3b, #059669);
            color: white; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
        }
    </style>
</head>

<body>
    <!-- Script de vérification automatique : si le prénom existe déjà, on redirige directement -->
    <script>
        const savedPrenom = localStorage.getItem('coranAppUserPrenom');
        const savedNiveau = localStorage.getItem('coranAppUserNiveau');
        if (savedPrenom && savedNiveau) {
            window.location.href = savedNiveau + '.html';
        }
    </script>

    <div id="onboardingModal" class="onboarding-overlay">
        <div class="onboarding-card">
            <div class="bismillah-header">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
            <div class="onboarding-title">Bienvenue ! 👋</div>
            <div class="onboarding-subtitle">Entre ton nom et choisis ton niveau pour personnaliser ton parcours.</div>

            <div class="form-group">
                <label>Prénom *</label>
                <input type="text" id="userPrenom" placeholder="Ex: Mohamed">
            </div>

            <div class="form-group">
                <label>Nom (optionnel)</label>
                <input type="text" id="userNom" placeholder="Ex: Berthé">
            </div>

            <div class="form-group">
                <label>Niveau d'apprentissage *</label>
                <select id="userNiveau">
                    <option value="debutant">🌱 Débutant</option>
                    <option value="moyen">🌿 Moyen</option>
                    <option value="professionnel">🌳 Professionnel</option>
                </select>
            </div>

            <button class="btn-continue" onclick="enregistrerProfil()">Commencer ➔</button>
        </div>
    </div>

    <script>
        function enregistrerProfil() {
            const prenom = document.getElementById('userPrenom').value.trim();
            const nom = document.getElementById('userNom').value.trim();
            const niveau = document.getElementById('userNiveau').value;

            if (!prenom) {
                alert("S'il te plaît, entre ton prénom !");
                return;
            }

            localStorage.setItem('coranAppUserPrenom', prenom);
            localStorage.setItem('coranAppUserNom', nom);
            localStorage.setItem('coranAppUserNiveau', niveau);

            window.location.href = niveau + '.html';
        }
    </script>
</body>
</html>
