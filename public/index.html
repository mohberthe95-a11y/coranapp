<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apprendre le Coran - LE VERIDIQUE A-Z</title>
    <style>
        :root {
            --primary-dark: #064e3b;
            --primary-accent: #059669;
            --gold-accent: #d97706;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --shadow-lg: 0 15px 35px rgba(0, 0, 0, 0.1);
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .onboarding-card {
            background: var(--card-bg);
            border-radius: 24px; padding: 30px 25px;
            width: 90%; max-width: 380px; text-align: center;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(217, 119, 6, 0.3);
        }
        .bismillah-header { font-size: 1.5rem; color: var(--primary-dark); margin-bottom: 10px; font-weight: 700; }
        .onboarding-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
        .onboarding-subtitle { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px; border-radius: 12px;
            border: 1px solid var(--border-color); background: var(--bg-main);
            color: var(--text-main); font-size: 0.95rem; box-sizing: border-box; outline: none;
        }
        .btn-continue {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #064e3b, #059669);
            color: white; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
        }
    </style>
</head>
<body>
    <div class="onboarding-card">
        <div class="bismillah-header">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
        <div class="onboarding-title">Bienvenue ! 👋</div>
        <div class="onboarding-subtitle">Entre ton nom et choisis ton niveau pour accéder à ton espace.</div>

        <div class="form-group">
            <label>Prénom *</label>
            <input type="text" id="userPrenom" placeholder="Ex: Mohamed">
        </div>

        <div class="form-group">
            <label>Nom (optionnel)</label>
            <input type="text" id="userNom" placeholder="Ex: Berthé">
        </div>

        <div class="form-group">
            <label>Niveau d'apprentissage *</label>
            <select id="userNiveau">
                <option value="debutant">🌱 Débutant</option>
                <option value="moyen">🌿 Moyen</option>
                <option value="professionnel">🌳 Professionnel</option>
            </select>
        </div>

        <button class="btn-continue" onclick="redirigerVersNiveau()">Commencer ➔</button>
    </div>

    <script>
        function redirigerVersNiveau() {
            const prenom = document.getElementById('userPrenom').value.trim();
            const nom = document.getElementById('userNom').value.trim();
            const niveau = document.getElementById('userNiveau').value;

            if (!prenom) {
                alert("S'il te plaît, entre ton prénom !");
                return;
            }

            localStorage.setItem('coranAppUserPrenom', prenom);
            localStorage.setItem('coranAppUserNom', nom);
            localStorage.setItem('coranAppUserNiveau', niveau);

            // Redirection automatique vers la bonne page selon le choix
            if (niveau === 'debutant') {
                window.location.href = 'debutant.html';
            } else if (niveau === 'moyen') {
                window.location.href = 'moyen.html';
            } else if (niveau === 'professionnel') {
                window.location.href = 'professionnel.html';
            }
        }
    </script>
</body>
</html>
